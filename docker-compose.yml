services:
  database:
    image: postgres:16-alpine
    container_name: pet-shop-warehouse
    environment:
      POSTGRES_DB: pet_shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pet_shop_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
      - ./исходные данные:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pet_shop"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pet_shop_data:
